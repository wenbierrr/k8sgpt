deployment:
  image:
    repository: wenbin681/k8sgpt
    tag: "v0.1" # defaults to Chart.appVersion if unspecified
  imagePullPolicy: Always
  annotations: {}
  ## optional env var for k8sgpt itself to send output to LLM endpoint 
  env:
    model: "openrouter/auto"
    backend: "openai" # one of: [ openai | llama ]
    baseUrl: " https://openrouter.ai/api/v1" # optional: custom API base URL, e.g. https://openrouter.ai/api/v1 (sets K8SGPT_BASEURL)
  
  # MCP (Model Context Protocol) server configuration
  mcp:
    enabled: true  # Enable MCP server
    port: "8089" # Port for MCP server
    http: true # Enable HTTP mode for MCP server
  resources:
    limits:
      cpu: "1"
      memory: "512Mi"
    requests:
      cpu: "0.2"
      memory: "156Mi"
  securityContext: {}

secret:
  existingSecret: "" # name of a pre-existing Secret holding the AI backend API key
  key: "secret-key"  # key within that Secret whose value becomes K8SGPT_PASSWORD

service:
  type: ClusterIP
  annotations: {}

serviceMonitor:
  enabled: false
  additionalLabels: {}
