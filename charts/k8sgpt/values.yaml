deployment:
  image:
    repository: ghcr.io/k8sgpt-ai/k8sgpt
    tag: "" # defaults to Chart.appVersion if unspecified
  imagePullPolicy: Always
  annotations: {}
  env:
    model: "gpt-3.5-turbo"
    backend: "openai" # one of: [ openai | llama ]
  # MCP (Model Context Protocol) server configuration
  mcp:
    enabled: false # Enable MCP server
    port: "8089" # Port for MCP server
    http: true # Enable HTTP mode for MCP server
  resources:
    limits:
      cpu: "1"
      memory: "512Mi"
    requests:
      cpu: "0.2"
      memory: "156Mi"
  securityContext: {}

secret:
  existingSecret: "" # name of a pre-existing Secret holding the AI backend API key
  key: "secret-key"  # key within that Secret whose value becomes K8SGPT_PASSWORD

service:
  type: ClusterIP
  annotations: {}

serviceMonitor:
  enabled: false
  additionalLabels: {}
